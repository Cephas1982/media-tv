name: Build APK

# Builds the TV app on a GitHub runner so no Android SDK, Gradle or JDK has to live on
# Lee's machines. Dispatch it from the Actions tab; the APK comes back as an artifact.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  apk:
    name: TV app (debug APK)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      # The runner image already ships the SDK; android-actions/setup-android is
      # deprecated and its bundled sdkmanager exits 1, so the packages are installed
      # through whichever sdkmanager this image actually has.
      - name: Install the SDK pieces this app compiles against
        run: |
          SDKMANAGER="$(command -v sdkmanager || true)"
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager 2>/dev/null | head -1)"
          fi
          echo "using $SDKMANAGER"
          yes | "$SDKMANAGER" --licenses > /dev/null 2>&1 || true
          yes | "$SDKMANAGER" --install "platforms;android-34" "build-tools;34.0.0" > /dev/null
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Unpack the upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "keystore written"

      - name: Build
        env:
          ANDROID_KEYSTORE: ${{ runner.temp }}/upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: gradle assembleDebug --no-daemon --console=plain
      - uses: actions/upload-artifact@v4
        with:
          name: media-tv-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
